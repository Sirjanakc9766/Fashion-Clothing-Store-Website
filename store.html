<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a Store | Fashion Station</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/store.css">
</head>
<body>

<header class="site-header">
  <div class="top-bar">
    <a href="homepage.html" class="logo"><img src="images/logo.jpeg" alt="Fashion Station logo"></a>

    <nav class="nav-bar">
      <a href="homepage.html">Online</a>
      <a href="homepage.html#women-grid">Women</a>
      <a href="homepage.html#men-grid">Men</a>
      <a href="homepage.html#kids-grid">Kids</a>
      <a href="store.html" class="active">Find a store</a>
    </nav>

    <div class="header-icons">
      <div class="search-box" id="search-box">
        <input type="text" id="search-input" placeholder="Search products..."
          onkeydown="if(event.key==='Enter') submitSearch(event)">
      </div>
      <a href="#" onclick="toggleSearch(); return false;"><i class="fa-solid fa-magnifying-glass"></i></a>
      <a href="cart.html"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<div class="store-wrap">

  <!-- GRID VIEW -->
  <section class="view active" id="view-grid">
    <div class="page-head">
      <h1>Find a Store</h1>
      <div class="store-search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="store-search" placeholder="Search by city or area…" aria-label="Search stores">
      </div>
    </div>

    <div class="store-grid" id="store-grid"></div>
    <p class="no-results" id="no-results">No stores match your search.</p>
  </section>

  <!-- DETAIL VIEW -->
  <section class="view" id="view-detail">
    <a class="back-link" href="#" id="back-link">&larr; Find a Store</a>

    <div class="detail-row title"><h1 id="d-name"></h1></div>
    <div class="detail-row address" id="d-address"></div>
    <div class="detail-row phone" id="d-phone"></div>
    <div class="detail-row categories" id="d-categories"></div>

    <iframe class="map-embed" id="d-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
  </section>

</div>

<footer class="site-footer">
  <div class="footer-links">
    <a href="about.html">About</a>
    <a href="policies.html">Our Policies</a>
    <a href="info.html">Info</a>
  </div>
  <div class="footer-bottom">Copyright &copy; 2026 Fashion Station | The Clothing Store. All rights reserved.</div>
</footer>

<script src="js/cart-store.js"></script>
<script src="js/store.js"></script>
<script src="js/search.js"></script>
</body>
</html>
