<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Fashion Station</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/checkout.css">
</head>
<body>

<header class="site-header">
  <div class="top-bar">
    <a href="homepage.html" class="logo"><img src="images/logo.jpeg" alt="Fashion Station logo"></a>

    <nav class="nav-bar">
      <a href="homepage.html">Online</a>
      <a href="homepage.html#women-grid">Women</a>
      <a href="homepage.html#men-grid">Men</a>
      <a href="homepage.html#kids-grid">Kids</a>
      <a href="store.html">Find a store</a>
    </nav>

    <div class="header-icons">
      <div class="search-box" id="search-box">
        <input type="text" id="search-input" placeholder="Search products..."
          onkeydown="if(event.key==='Enter') submitSearch(event)">
      </div>
      <a href="#" onclick="toggleSearch(); return false;"><i class="fa-solid fa-magnifying-glass"></i></a>
      <a href="cart.html"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<div class="checkout-container">

  <div class="billing">
    <h2>Billing Details</h2>

    <div class="row">
      <div class="input-box">
        <label>First Name *</label>
        <input type="text" placeholder="First Name" required>
      </div>
      <div class="input-box">
        <label>Last Name *</label>
        <input type="text" placeholder="Last Name" required>
      </div>
    </div>

    <div class="input-box">
      <label>Company Name (Optional)</label>
      <input type="text">
    </div>

    <div class="input-box">
      <label>Country / Region *</label>
      <select required>
        <option>Nepal</option>
        <option>India</option>
        <option>China</option>
      </select>
    </div>

    <div class="input-box">
      <label>Street Address *</label>
      <input type="text" placeholder="House Number and Street Name" required>
    </div>

    <div class="row">
      <div class="input-box">
        <label>Town / City *</label>
        <input type="text" required>
      </div>
      <div class="input-box">
        <label>Province *</label>
        <select required>
          <option>Bagmati</option>
          <option>Gandaki</option>
          <option>Koshi</option>
          <option>Lumbini</option>
          <option>Madhesh</option>
          <option>Sudurpashchim</option>
          <option>Karnali</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="input-box">
        <label>ZIP Code</label>
        <input type="text">
      </div>
      <div class="input-box">
        <label>Phone *</label>
        <input type="text" required>
      </div>
    </div>

    <div class="input-box">
      <label>Email Address *</label>
      <input type="email" required>
    </div>

    <div class="input-box">
      <label>Order Notes</label>
      <textarea rows="4" placeholder="Notes about your order"></textarea>
    </div>
  </div>

  <div class="order-summary">
    <h2>Your Order</h2>

    <table>
      <thead>
        <tr><th>Product</th><th>Total</th></tr>
      </thead>
      <tbody id="order-items"></tbody>
    </table>

    <div class="summary-row">
      <span>Subtotal</span><span id="order-subtotal">Rs. 0</span>
    </div>
    <div class="summary-row">
      <span>Shipping</span><span>Free</span>
    </div>
    <div class="summary-row total">
      <span>Total</span><span id="order-total">Rs. 0</span>
    </div>

    <div class="payment">
      <h3>Payment Method</h3>
      <label><input type="radio" name="payment" checked> Cash on Delivery</label>
      <label><input type="radio" name="payment"> eSewa</label>
      <label><input type="radio" name="payment"> Khalti</label>
    </div>

    <button type="button" class="place-order" id="place-order-btn">Place Order</button>
  </div>

</div>

<footer class="site-footer">
  <div class="footer-links">
    <a href="about.html">About</a>
    <a href="policies.html">Our Policies</a>
    <a href="info.html">Info</a>
  </div>
  <div class="footer-bottom">Copyright &copy; 2026 Fashion Station | The Clothing Store. All rights reserved.</div>
</footer>

<script src="js/cart-store.js"></script>
<script src="js/checkout.js"></script>
<script src="js/search.js"></script>
</body>
</html>
